<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absolute Positioning Relative Influence</title>
  <style>
    .relative-container {
      position: relative;
      width: 300px;
      height: 200px;
      background-color: lightgray;
    }

    .absolute-element {
      position: absolute;
      left: 50px;
      top: 30px;
      width: 100px;
      height: 50px;
      background-color: coral;
    }

    .move-relative {
      position: relative;
      left: 50px;
      top: 40px;
      background-color: lightblue;
    }
  </style>
</head>
<body>

<div class="relative-container">
  <div class="absolute-element">Absolute</div>
</div>

<br>

<!-- Adding another relative element -->
<div class="relative-container">
  <div class="move-relative">Relative with offset</div>
  <div class="absolute-element">Absolute</div>
</div>

</body>
</html>
